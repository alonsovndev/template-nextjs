name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The reusable workflows are pinned to an immutable commit of the
# github-workflows repository, not a branch, so a push there cannot silently
# change this repository's CI. Bump the SHA deliberately; switch to the v1 tag
# once that repository cuts a release.
jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    uses: alonsovndev/github-workflows/.github/workflows/pr-title.yml@59c9754ba4a9dcb6628ac78746c4002f99d1202a

  frontend:
    uses: alonsovndev/github-workflows/.github/workflows/frontend-ci.yml@59c9754ba4a9dcb6628ac78746c4002f99d1202a
    with:
      e2e: true
